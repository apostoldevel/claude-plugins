# team.conf -- the ONE place where this team's project facts live.
#
# Plain bash, sourced by guard-write.sh, session-start.sh, context-guard.sh and filter-output.sh.
# Assignments only: no commands with side effects. Edit the values, keep the variable names.
#
# Lookup (each script): $TEAM_CONF, else next to the script, else the first
# <dir>/.claude/hooks/team.conf found walking UP from the script's directory. A layer's barrier
# copy (<root>/<layer>/.claude/hooks/guard-write.sh) therefore finds the coordinator's file
# without a copy of its own; give a layer its own team.conf only if its settings must differ.
# If the barrier cannot find this file it refuses every write (fail-closed).

# ---- identity ---------------------------------------------------------------------------------
TEAM="acme"                          # agents are named ${TEAM}-<role>: acme-owner, acme-db, ...
WORKSPACE_DIR="$HOME/work"           # holds this project, its sibling projects and framework mirrors
PROJECT_ROOT="$WORKSPACE_DIR/acme"   # the project this team works in (absolute)
# Other ways WORKSPACE_DIR may be spelled in shell commands (space-separated absolute paths, e.g.
# through a symlink). Already recognised without listing: the real path, `~/x`, `$HOME/x`,
# `${HOME}/x` when the workspace is under $HOME. Relative spellings (`../other-app`) are not.
WORKSPACE_ALIASES=""

# ---- roles ------------------------------------------------------------------------------------
# <launch directory, relative to PROJECT_ROOT; "." = the root> = <role>[|<second role>]
# The role is read from the directory the session was started in. A directory that is not listed
# is role "unknown": the barrier then refuses every file write (a false refusal is visible, a
# silent pass is not). Role names: letters, digits, underscore. Two roles may share a directory
# (role|role): the barrier uses the first; session-start.sh tells the agent to pick by $AGENT_ENV.
ROLE_MAP='
.=owner
ops=devops
tests=qa
audit=audit
db=db
backend=backend|framework
frontend=frontend
'
COORDINATOR_ROLE="owner"             # its clears/compactions are not logged (it is the one watching)
AGENT_ENV="TEAM_AGENT"               # `TEAM_AGENT=framework claude` picks the second role of a shared dir

# Per-role write scope INSIDE PROJECT_ROOT (globs relative to it, space-separated; `*` crosses `/`).
#   ALLOW_<role>  narrows the role to a positive allow-list (layer agents, the auditor).
#   DENY_<role>   keeps the role out of these subtrees (a coordinator that writes no code).
#   neither       the role may write anywhere inside the root (secrets and EXTRA_DENY still apply).
#   HINT_<role>   optional sentence appended to that role's refusals.
DENY_owner="backend/* db/* frontend/* tests/*"
HINT_owner="Write no code: file a card for the owner of that layer."
ALLOW_audit="audit/* docs/wiki/audit/* docs/board/cards/*"
HINT_audit="Fixes nothing: a finding is a card for the layer's owner."
ALLOW_db="db/* docs/wiki/db/* docs/board/cards/*"
ALLOW_backend="backend/* docs/wiki/backend/* docs/board/cards/*"
ALLOW_frontend="frontend/* docs/wiki/frontend/* docs/board/cards/*"

# ---- what is read-only everywhere ------------------------------------------------------------
# Framework mirrors / reference checkouts: names under WORKSPACE_DIR, space- or |-separated.
# Only `git pull` is allowed there. The framework is patched INSIDE the project (submodule),
# tested with the project's own code, then pushed upstream and pinned. Matching is anchored by
# a trailing separator, so `kit` does not swallow the project `kit-app` or `kit.v2`.
MIRRORS="kit kit.v2 shared/platform"
# Secrets stay read-only; templates (SECRET_TEMPLATE_GLOBS) are checked first and stay editable.
SECRET_GLOBS="*/.secrets/* */.pgpass */passwords.psql */license.json */.env.production"
SECRET_TEMPLATE_GLOBS="*.example *.sample *.template"
# Extra refusals for every role, absolute-path globs. Example: keep agents out of their own
# barrier and settings (then hooks are changed by hand, outside the agents):
# EXTRA_DENY="*/.claude/hooks/* */.claude/settings.json */.claude/settings.local.json"
EXTRA_DENY=""

# TEMPORARY EXCEPTIONS (file tools only; Bash keeps refusing foreign projects).
# One line per exception: <role or *> <absolute glob>. Every line needs its REMOVAL CONDITION
# next to it, and is deleted when the condition is met. Example (commented out):
#   # REMOVE WHEN: the new project's own team is launched (card 12, owner's word 2026-01-31).
#   # owner $WORKSPACE_DIR/new-project/docs/*
TEMP_ALLOW=''

# The auditor measures things with throwaway tools in the session scratchpad; let these roles
# write there (only THEIR OWN launch directory's scratchpad). `*` = every role. Empty = none.
SCRATCHPAD_ROLES="audit"
SCRATCHPAD_BASE="/tmp/claude-$(id -u)"

# ---- lifecycle --------------------------------------------------------------------------------
# session-start.sh appends "HH:MM <agent> clear|compact" here; the coordinator watches it with
# Monitor (`tail -n0 -F <file>`) and re-briefs the agent that just lost its context.
LIFECYCLE_LOG="${XDG_RUNTIME_DIR:-/tmp}/${TEAM}-lifecycle.log"

# ---- context guard ----------------------------------------------------------------------------
CONTEXT_SOFT=300000                  # above this: no new card unrelated to the current one
CONTEXT_STEP=25000                   # while working with tools, remind every +STEP
CONTEXT_HARD=450000                  # above this: finish to a point of continuation only
READY_PHRASE="Ready for compaction or clear"   # the owner's choice; must match the charter

# ---- what session-start.sh says about each role ---------------------------------------------
MINE_owner="coordination, the board, STATE.md, docs/, the charter"
NOTMINE_owner="layer code: you write none; slice the task, file the card, accept the result"
MINE_db="all SQL: the schema, migrations, the DB tests"
NOTMINE_db="application code; another layer's files -- a card, not an edit"
MINE_backend="the server code"
NOTMINE_backend="SQL and the frontend -- a card, not an edit"
MINE_framework="the framework submodule and its skill"
NOTMINE_framework="the project's own server code"
MINE_frontend="the web apps"
NOTMINE_frontend="the server and SQL"
MINE_qa="the cross-layer test harness"
NOTMINE_qa="the code under test: a red test is a card to the layer, not a fix"
MINE_devops="deployment, releases, brands"
NOTMINE_devops="layer code"
MINE_audit="conformance audit: requirement -> file:line -> test -> deviation; own reports and the audit wiki"
NOTMINE_audit="fixes nothing: every layer is closed to you, a finding is a card"

# ---- filter-output.sh (optional) -------------------------------------------------------------
# Extra long-running project scripts whose output should be trimmed to errors + the summary
# line (regex matched against the whole command). Empty = pytest / go / cmake / docker only.
# FILTER_SCRIPT_RE='(^|[[:space:];&])\./(migrate|db-update)\.sh'
FILTER_SCRIPT_RE=''
